apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-service
  namespace: fastdrop
  labels:
    app: warehouse-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warehouse-service
  template:
    metadata:
      labels:
        app: warehouse-service
    spec:
      containers:
        - name: warehouse-service
          image: fastdrop/warehouse-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: fastdrop-config
            - secretRef:
                name: fastdrop-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://fastdrop-postgres:5432/warehouse_db"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-service
  namespace: fastdrop
spec:
  selector:
    app: warehouse-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: http
